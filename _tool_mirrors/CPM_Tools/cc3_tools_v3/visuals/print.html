<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Printable - Teacher Tools</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:#e8edf2;font-family:Arial,sans-serif;color:#111}
.controls{position:sticky;top:0;z-index:5;display:flex;justify-content:center;padding:12px;background:#12365c}
.controls button{border:0;border-radius:8px;background:white;color:#12365c;padding:10px 18px;font-weight:800;font-size:15px;cursor:pointer}
/* Screen preview is a literal Letter sheet. Content uses absolute regions so
   adding a title can never create another page or push the copy grid downward. */
.page{--page-w:8.5in;--page-h:11in;--edge:.38in;--title-h:.38in;--gap:.10in;position:relative;width:var(--page-w);height:var(--page-h);margin:24px auto;background:#fff;box-shadow:0 3px 18px rgba(0,0,0,.16);overflow:hidden}
.page.landscape{--page-w:11in;--page-h:8.5in}
.title{position:absolute;left:var(--edge);right:var(--edge);top:.28in;height:var(--title-h);display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:800;line-height:1.05;text-align:center;overflow:hidden}
.title[hidden]{display:none}
.grid{position:absolute;left:var(--edge);right:var(--edge);top:var(--edge);bottom:var(--edge);display:grid;gap:.13in;min-width:0;min-height:0}
.page.with-title .grid{top:calc(.28in + var(--title-h) + var(--gap))}
.cell{min-width:0;min-height:0;position:relative;overflow:hidden}
.cell img{position:absolute;inset:0;width:100%;height:100%;display:block;object-fit:contain;object-position:center}
.c1{grid-template-columns:1fr;grid-template-rows:1fr}
.c2{grid-template-columns:1fr;grid-template-rows:repeat(2,minmax(0,1fr))}
.c4{grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:repeat(2,minmax(0,1fr))}
.c6{grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:repeat(3,minmax(0,1fr))}
.c8{grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:repeat(4,minmax(0,1fr))}
.landscape .c2{grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:1fr}
.landscape .c4{grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:repeat(2,minmax(0,1fr))}
.landscape .c6{grid-template-columns:repeat(3,minmax(0,1fr));grid-template-rows:repeat(2,minmax(0,1fr))}
.landscape .c8{grid-template-columns:repeat(4,minmax(0,1fr));grid-template-rows:repeat(2,minmax(0,1fr))}
@page{size:Letter portrait;margin:.20in}
@media print{
  html,body{background:#fff;width:auto;height:auto;overflow:hidden}
  .controls{display:none!important}
  /* Stay slightly inside the page content box to avoid Chrome/WebKit rounding
     that can otherwise create a second nearly-empty page. */
  .page{--page-w:8.08in;--page-h:10.58in;--edge:.18in;margin:0!important;width:var(--page-w)!important;height:var(--page-h)!important;box-shadow:none!important;break-inside:avoid;page-break-inside:avoid;overflow:hidden}
  .page.landscape{--page-w:10.58in;--page-h:8.08in}
}
</style>
</head>
<body>
<div class="controls"><button type="button" onclick="window.print()">Print / Save PDF</button></div>
<main id="page" class="page"><div id="title" class="title" hidden></div><div id="grid" class="grid c1"></div></main>
<script>
const p=new URLSearchParams(location.search);
const src=p.get('src')||'';
const title=p.get('title')||'Printable';
const requested=Number(p.get('copies'));
const copies=[1,2,4,6,8].includes(requested)?requested:1;
const orientation=p.get('orientation')==='landscape'?'landscape':'portrait';
const showTitle=p.get('showTitle')==='1';
const page=document.getElementById('page'),grid=document.getElementById('grid'),titleEl=document.getElementById('title');
document.title=title+' - Printable';
if(orientation==='landscape'){
  page.classList.add('landscape');
  const st=document.createElement('style');
  st.textContent='@page{size:Letter landscape;margin:.20in}';
  document.head.append(st);
}
grid.className='grid c'+copies;
if(showTitle){page.classList.add('with-title');titleEl.hidden=false;titleEl.textContent=title}
for(let i=0;i<copies;i++){
  const c=document.createElement('div');c.className='cell';c.dataset.copy=String(i+1);
  const img=document.createElement('img');img.src=src;img.alt=`${title} copy ${i+1}`;c.append(img);grid.append(c);
}
</script>
</body>
</html>
