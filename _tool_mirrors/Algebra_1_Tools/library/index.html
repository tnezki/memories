<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Algebra 1 Library</title><link rel="stylesheet" href="../shared/course-tool.css"><script src="../shared/course-tool.js" defer></script></head><body>
<div class="topbar"><div class="brand">Algebra 1 Library</div><div class="topnav"><a href="../index.html">Algebra 1 Tools</a></div></div>
<main class="wrap"><div id="message" class="message"></div><section class="hero"><h1>Library</h1><p>One organized view of teacher-created local materials and existing student-facing Algebra resources. Local-only teachers keep files here and upload to Canvas manually; GitHub publishers can also open hosted student pages.</p><div class="settings-row"><strong>Student delivery:</strong><select id="delivery"><option value="local_only">Local Library only</option><option value="local_and_github">Local Library + GitHub hosted</option></select><span id="modeHint" class="small"></span></div></section>
<div class="library-toolbar"><div class="search"><input id="search" type="search" placeholder="Search titles or paths…"></div><div class="filters"><select id="unit"><option value="">All units</option></select></div><div class="filters"><select id="source"><option value="">Local + hosted</option><option value="local">Local only</option><option value="github">GitHub-hosted source</option></select></div></div>
<div id="tabs" class="tabs"></div><div id="count" class="small"></div><div id="list" class="list" style="margin-top:10px"></div></main>
<script>
let payload={items:[],categories:[],status:{}}, active='all';const $=id=>document.getElementById(id), msg=$('message');
function show(t,e=false){msg.textContent=t;msg.className='message show'+(e?' error':'');setTimeout(()=>msg.className='message',5000)}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function renderTabs(){const tabs=[{key:'all',label:'All'},...payload.categories];$('tabs').innerHTML=tabs.map(t=>`<button class="tab ${active===t.key?'active':''}" data-k="${t.key}">${esc(t.label)}</button>`).join('');document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{active=b.dataset.k;renderTabs();render();});}
function render(){const q=$('search').value.trim().toLowerCase(),u=$('unit').value,src=$('source').value;const items=payload.items.filter(x=>(active==='all'||x.category===active)&&(!u||x.unit===u)&&(!src||x.source===src)&&(!q||(`${x.title} ${x.relative_path}`).toLowerCase().includes(q)));$('count').textContent=`${items.length} item${items.length===1?'':'s'} shown`;if(!items.length){$('list').innerHTML='<div class="empty">No items match these filters.</div>';return}$('list').innerHTML=items.slice(0,500).map(x=>{const hosted=x.hosted_url?`<a class="btn primary" href="${esc(x.hosted_url)}" target="_blank">Open Student Page ↗</a>`:'';const local=x.local_path?`<button class="btn openLocal" data-path="${encodeURIComponent(x.local_path)}">Open Local</button>`:'';return `<article class="item"><div><h3>${esc(x.title)}</h3><div class="meta"><span class="badge">${esc(x.category)}</span>${x.unit?`<span class="badge">Unit ${esc(x.unit)}</span>`:''}<span class="badge ${x.source==='github'?'hosted':'local'}">${x.source==='github'?'GitHub source':'Local'}</span><span>${esc(x.kind)}</span><span>${esc(x.relative_path)}</span></div></div><div class="item-actions">${local}${hosted}</div></article>`}).join('');document.querySelectorAll('.openLocal').forEach(b=>b.onclick=async()=>{const res=await fetch('/api/open-local?path='+b.dataset.path),d=await res.json();if(!res.ok)show(d.error||'Could not open.',true);});}
async function load(){payload=await fetch('/api/library').then(r=>r.json());$('delivery').value=payload.status.delivery_mode;$('delivery').querySelector('[value="local_and_github"]').disabled=!payload.status.github_workspace;$('modeHint').textContent=payload.status.github_workspace?'GitHub workspace detected; hosted URLs are available for repository items.':'Portable local-only mode; hosted publishing can be configured later.';const units=[...new Set(payload.items.map(x=>x.unit).filter(Boolean))].sort((a,b)=>Number(a)-Number(b));$('unit').innerHTML='<option value="">All units</option>'+units.map(u=>`<option value="${esc(u)}">Unit ${esc(u)}</option>`).join('');renderTabs();render();}
['search','unit','source'].forEach(id=>$(id).addEventListener(id==='search'?'input':'change',render));$('delivery').addEventListener('change',async()=>{const res=await fetch('/api/settings',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({delivery_mode:$('delivery').value})}),d=await res.json();if(!res.ok){show(d.error||'Could not save.',true);return}show('Student delivery preference saved.');load();});load();
</script></body></html>
