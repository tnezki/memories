<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Algebra 1 Student Bank</title>
<script>window.MathJax={tex:{inlineMath:[['\\(','\\)'],['$','$']],displayMath:[['\\[','\\]'],['$$','$$']]},svg:{fontCache:'global'}};</script><script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>
<style>
:root{--ink:#17243a;--navy:#173f73;--muted:#5f6f84;--line:#cfdae7;--pale:#f6f8fb;--blue:#eaf1fa;--target:#fff7d6}*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;color:var(--ink);background:#f4f6f8}.wrap{max-width:1180px;margin:auto;padding:18px}.top{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px 20px;margin-bottom:14px}.top h1{margin:0;color:var(--navy);font-size:28px}.top p{margin:5px 0 0;color:var(--muted);line-height:1.35}.count{font-weight:700}.goal{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden;margin:14px 0}.goal-banner{background:var(--navy);color:#fff;padding:15px 18px}.goal-banner h2{margin:0;font-size:21px}.goal-banner p{margin:5px 0 0;font-size:13px}.ican-block{padding:14px;border-top:1px solid var(--line);scroll-margin-top:10px}.ican-block:first-of-type{border-top:0}.ican-head{background:var(--blue);border:1px solid #c7d6e9;border-radius:10px;padding:11px 13px;margin-bottom:10px}.ican-head .id{font-size:12px;font-weight:800;color:var(--navy)}.ican-head h3{margin:3px 0 0;font-size:18px}.family-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.family{border:1px solid var(--line);border-radius:11px;background:#fff;padding:12px;scroll-margin-top:12px}.family.targeted{outline:4px solid #e5b700;background:var(--target)}.ican-block.targeted-ican>.ican-head{outline:2px solid #e5b700}.family-head{display:flex;gap:8px;align-items:center;margin-bottom:7px}.badge{background:var(--blue);color:var(--navy);font-weight:800;border-radius:999px;padding:3px 8px;font-size:12px}.family-name{font-weight:800;font-size:16px}.purpose{font-size:12px;color:#44566e;line-height:1.35}.question{border-left:4px solid #7892b3;padding:8px 10px;margin-top:9px;background:#fbfcfe}.question h4{margin:0 0 6px;font-size:13px}.question p{font-size:14px;line-height:1.35}.graph,.figure{display:block;max-width:220px;width:100%;height:auto;margin:8px auto}.response-surface{border:1px dashed #9baec5;border-radius:8px;min-height:50px;padding:8px;color:#66758a;margin-top:8px}details{margin-top:8px;font-size:12px}summary{font-weight:800;cursor:pointer}.error{background:#fff1f1;border:1px solid #e3aaaa;padding:14px;border-radius:8px}@media(max-width:900px){.family-grid{grid-template-columns:1fr}.wrap{padding:10px}.top h1{font-size:23px}.goal-banner h2{font-size:18px}.ican-head h3{font-size:16px}.family-name{font-size:15px}}
</style></head><body><main class="wrap"><header class="top"><h1 id="title">Algebra 1 Student Practice Bank</h1><p>Use the exact <b>MG</b>, <b>I Can</b>, and <b>Family</b> printed on your Portfolio report. All three families for the same I Can stay grouped together here.</p><p class="count" id="count">Loading…</p></header><div id="bank"></div></main>
<script>
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function getJson(path){const r=await fetch(path,{cache:'no-store'});if(!r.ok)throw new Error(path+' ('+r.status+')');return r.json()}
async function getManifest(){try{return await getJson('BANK_MANIFEST.json')}catch(e){return await getJson('MG_BANK_MANIFEST.json')}}
function familyCard(f){const ex=f.exemplar||{};return `<article class="family" id="${esc(f.family_id)}"><div class="family-head"><span class="badge">Family ${esc(f.family_label)}</span><span class="family-name">${esc(f.family_name)}</span></div><p class="purpose">${esc(f.family_purpose)}</p><div class="question"><h4>Example</h4>${ex.student_html||'<p>Example unavailable.</p>'}</div><details><summary>Answer + short solution</summary><p><strong>Answer:</strong> ${esc(ex.answer)}</p><p>${esc(ex.solution)}</p></details></article>`}
function jumpToHash(){document.querySelectorAll('.targeted').forEach(x=>x.classList.remove('targeted'));document.querySelectorAll('.targeted-ican').forEach(x=>x.classList.remove('targeted-ican'));const id=decodeURIComponent(location.hash.slice(1));if(!id)return;const target=document.getElementById(id);if(!target)return;target.classList.add('targeted');const block=target.closest('.ican-block');if(block)block.classList.add('targeted-ican');target.scrollIntoView({block:'start'})}
async function main(){try{const [manifest,index]=await Promise.all([getManifest(),getJson('FAMILY_INDEX.json')]);const unit=manifest.unit||index.unit;document.title=`Algebra 1 Unit ${unit} Student Bank`;document.getElementById('title').textContent=`Algebra 1 · Unit ${unit} Student Practice Bank`;document.getElementById('count').textContent=`${manifest.mastery_goal_count||''} Mastery Goals · ${manifest.i_can_count||''} I Cans · ${manifest.family_count||index.family_count} practice families`;const mgIds=[...new Set(index.families.map(f=>f.mastery_goal_id))];const goals=await Promise.all(mgIds.map(id=>getJson(`mastery_goals/${id}.json`)));const host=document.getElementById('bank');for(const g of goals){const mg=g.mastery_goal,icans=g.i_cans||[];const section=document.createElement('section');section.className='goal';section.id=mg.goal_id;let html=`<header class="goal-banner"><h2>${esc(mg.goal_id)} · ${esc(mg.title)}</h2><p>${esc(mg.exact_text)}</p></header>`;for(const ic of icans){html+=`<section class="ican-block" id="${esc(ic.i_can_id)}"><header class="ican-head"><div class="id">${esc(ic.i_can_id)}</div><h3>${esc(ic.exact_text)}</h3></header><div class="family-grid">${(ic.families||[]).map(f=>familyCard(f)).join('')}</div></section>`}section.innerHTML=html;host.appendChild(section)}if(window.MathJax?.typesetPromise)await MathJax.typesetPromise();jumpToHash()}catch(err){document.getElementById('bank').innerHTML=`<div class="error"><strong>Student Bank could not load.</strong><br>${esc(err.message)}</div>`;document.getElementById('count').textContent='Load failed'}}
window.addEventListener('hashchange',jumpToHash);main();
</script></body></html>
