<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="520" viewBox="0 0 1000 520">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <style>
    .title{font:700 28px Arial, sans-serif; fill:#172033}
    .label{font:700 21px Arial, sans-serif; fill:#172033}
    .small{font:16px Arial, sans-serif; fill:#596579}
    .count{font:700 18px Arial, sans-serif; fill:#234f73}
    .bond{stroke:#172033;stroke-width:7;stroke-linecap:round}
    .panel{fill:#f3f6f9;stroke:#cfd8e3;stroke-width:2;rx:18}
    .arrow{stroke:#234f73;stroke-width:7;marker-end:url(#arrow);fill:none}
  </style>
  <defs><marker id="arrow" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L14,7 L0,14 z" fill="#234f73"/></marker></defs>
  <text x="40" y="48" class="title">Read the code in molecule models</text>
<rect class="panel" x="60" y="95" width="410" height="340"/><rect class="panel" x="530" y="95" width="410" height="340"/>
<text x="265" y="142" text-anchor="middle" class="label">H2O water molecule</text>
<text x="735" y="142" text-anchor="middle" class="label">O2 oxygen molecule</text><line class="bond" x1="160" y1="265" x2="265" y2="220"/><line class="bond" x1="265" y1="220" x2="370" y2="265"/><circle cx="160" cy="265" r="36" fill="#dbe8f6" stroke="#172033" stroke-width="3"/><text x="160" y="272" text-anchor="middle" class="label" fill="#172033">H</text><circle cx="265" cy="220" r="50" fill="#ee8b8b" stroke="#172033" stroke-width="3"/><text x="265" y="227" text-anchor="middle" class="label" fill="#172033">O</text><circle cx="370" cy="265" r="36" fill="#dbe8f6" stroke="#172033" stroke-width="3"/><text x="370" y="272" text-anchor="middle" class="label" fill="#172033">H</text><line class="bond" x1="660" y1="255" x2="810" y2="255"/><circle cx="660" cy="255" r="55" fill="#ee8b8b" stroke="#172033" stroke-width="3"/><text x="660" y="262" text-anchor="middle" class="label" fill="#172033">O</text><circle cx="810" cy="255" r="55" fill="#ee8b8b" stroke="#172033" stroke-width="3"/><text x="810" y="262" text-anchor="middle" class="label" fill="#172033">O</text><text x="265" y="383" text-anchor="middle" class="count">2 hydrogen + 1 oxygen</text><text x="735" y="383" text-anchor="middle" class="count">2 oxygen atoms bonded</text>
</svg>