<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="520" viewBox="0 0 1000 520">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <style>
    .title{font:700 28px Arial, sans-serif; fill:#172033}
    .label{font:700 21px Arial, sans-serif; fill:#172033}
    .small{font:16px Arial, sans-serif; fill:#596579}
    .count{font:700 18px Arial, sans-serif; fill:#234f73}
    .bond{stroke:#172033;stroke-width:7;stroke-linecap:round}
    .panel{fill:#f3f6f9;stroke:#cfd8e3;stroke-width:2;rx:18}
    .arrow{stroke:#234f73;stroke-width:7;marker-end:url(#arrow);fill:none}
  </style>
  <defs><marker id="arrow" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L14,7 L0,14 z" fill="#234f73"/></marker></defs>
  <text x="40" y="52" class="title">Model key: circles stand for atoms</text>
<rect class="panel" x="42" y="86" width="916" height="350"/>
<g transform="translate(0,0)"><circle cx="155" cy="190" r="46" fill="#dbe8f6" stroke="#172033" stroke-width="3"/><text x="155" y="197" text-anchor="middle" class="label" fill="#172033">H</text><text x="155" y="275" text-anchor="middle" class="label">Hydrogen atom</text><text x="155" y="307" text-anchor="middle" class="small">same color = same element</text><circle cx="365" cy="190" r="46" fill="#ee8b8b" stroke="#172033" stroke-width="3"/><text x="365" y="197" text-anchor="middle" class="label" fill="#172033">O</text><text x="365" y="275" text-anchor="middle" class="label">Oxygen atom</text><text x="365" y="307" text-anchor="middle" class="small">same color = same element</text><circle cx="575" cy="190" r="46" fill="#9aa6b2" stroke="#172033" stroke-width="3"/><text x="575" y="197" text-anchor="middle" class="label" fill="#172033">C</text><text x="575" y="275" text-anchor="middle" class="label">Carbon atom</text><text x="575" y="307" text-anchor="middle" class="small">same color = same element</text><circle cx="785" cy="190" r="46" fill="#b8d8ba" stroke="#172033" stroke-width="3"/><text x="785" y="197" text-anchor="middle" class="label" fill="#172033">N</text><text x="785" y="275" text-anchor="middle" class="label">Nitrogen atom</text><text x="785" y="307" text-anchor="middle" class="small">same color = same element</text></g><text x="500" y="394" text-anchor="middle" class="count">A molecule is two or more atoms bonded together.</text>
</svg>